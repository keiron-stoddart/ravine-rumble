    <p>Pick up where the 2025 season left off.</p>

    <ul class="nav nav-pills gap-2">
        <li class="nav-item">
            <a class="nav-link {{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Loser Tournament</a>

        <li class="nav-item">

    </ul>

{% endblock %}
