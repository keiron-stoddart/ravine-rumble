{% extends "base.html" %}

{% block title %}Interactive Image Display{% endblock %}

{% block extra_head %}
<style>
    .bracket-wrapper {
        background: linear-gradient(to bottom, #ff7e5f, #feb47b);
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 56px);
        overflow: hidden;
        color: #fff;
    }

    .image-container {
        position: relative;
        text-align: center;
        transition: transform 0.5s ease, box-shadow 0.5s ease;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .image-container:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .image-container img {
        width: 100%;
        height: auto;
        border-radius: 15px;
    }

    .image-caption {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 15px;
        background: rgba(0, 0, 0, 0.7);
        font-size: 1.2rem;
        transform: translateY(100%);
        transition: transform 0.3s ease;
    }

    .image-container:hover .image-caption {
        transform: translateY(0);
    }
</style>
{% endblock %}

{% block content %}
<div class="bracket-wrapper">
    <div class="image-container">
        <img src="{{ url_for('static', filename='bracket.jpg') }}" alt="Uploaded Image">
        <div class="image-caption">2024 Loser Bracket</div>
    </div>
</div>
{% endblock %}
